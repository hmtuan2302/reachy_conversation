[project]
name = "reachy-demo"
version = "0.1.0"
description = "Agentic Reachy Mini Wireless demo: realtime voice, perception, attention, memory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "httpx>=0.28",
    "websockets>=14",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
robot = [
    "reachy-mini>=1.13",                 # SDK; needs GStreamer on the host (see docs/architecture/06-operations.md)
    "reachy-mini-dances-library>=0.2.1", # dance moves for the `dance` tool (Pollen Robotics)
]
perception = ["mediapipe>=0.10", "opencv-python-headless>=4.10"]
speaker = ["sherpa-onnx>=1.10"]          # speaker-embedding gate
mic = ["sounddevice>=0.5"]
vieneu = ["vieneu>=3.7"]                 # local VieNeu-TTS v3 Turbo (TTS_PROVIDER=vieneu)
embed = [
    "huggingface-hub>=0.25",
    "tokenizers>=0.20",
]

[project.scripts]
reachy-demo = "reachy_demo.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_demo"]

[tool.ruff]
extend-exclude = ["reference"]   # third-party code kept verbatim for porting
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/reachy_demo", "tests"]
# SDK / model libs ship without stubs
[[tool.mypy.overrides]]
module = ["reachy_mini.*", "reachy_mini_dances_library.*", "mediapipe.*", "cv2.*", "sherpa_onnx.*", "onnxruntime.*", "sounddevice.*", "vieneu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the real robot and/or network (deselect with -m 'not integration')",
]
